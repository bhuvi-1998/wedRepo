<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div align="center">
    <h1>Wellcome To 10000 CODERS Registration Page</h1>
    <p >In this we want you to enter your</p>
    </div>
    <form >
        <label for="fullname">Full Name :</label>
        <input type="text" id="fullname" name="fullname"><br><br>
        <label for="Email">Email :</label>
        <input type="email" name="Email" id="Email"><br><br>
        <label>Phone Number :</label>
        <input type="tel" name="phno" id="phno"><br><br>
        <lable>Date of Birth :</lable>
        <input type="date" name="dob" id="dob"><br><br>
        <label>Gender :</label>
        <input type="radio" value="Male" id="Male">
        <label for="Male">Male</label>
        <input type="radio" value="Female" id="Female">
        <label for="Female">Female</label><br><br>
        <label for="Course">Course Selection</label>
        <select name="Course" id="Course">
            <option value="select a option">---Select A Option---</option>
            <option value="python">Python</option>
            <option value="sql">SQL</option>
            <option value="java">Java</option>
            <option value="DSA">DSA</option>

        </select><br><br>
        <label for="batch">Preferred batch timing :</label>
        <input type="radio" name="mng" id="mng">
        <label for="morning">Morning</label>
        <input type="radio" name="afternoon" id="afternoon">
        <label>Afternoon</label>
        <input type="radio" name="evening" id="evening">
        <label for="evening">Evening</label><br><br>
        <label for="address">Address</label>
        <textarea name="address" id="address" cols="35" rows="7"></textarea><br><br>
        <label for="resume">Upload Resume</label>
        <input type="file" name="resume" id="resume"><br><br>
        <label for="tc">TERMS &amp; CONDITIONS</label>
        <input type="checkbox" name="tc" id="tc"><br><br>
        
        <input type="submit" name="submit" id="submit">
        <input type="reset" name="reset" id="reset">

    </form>
</body>
</html>
